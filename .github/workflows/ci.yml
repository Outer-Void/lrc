name: CI

on:
  push:
    branches: ["main", "stage-*/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          # Test-only: the Contract v1 SDK validates .blux/, and DAT exercises the --audit handoff.
          # LRC itself imports neither (tests/test_blux_adapter.py checks that).
          pip install "blux-sdk @ git+https://github.com/Outer-Void/blux.git@0b09a46a98a29cbdb108679f3ef5252b0b6881d1#subdirectory=sdk/python"
          pip install --no-deps "outervoid-dat @ git+https://github.com/Outer-Void/dat.git@ba5838636d8576b555fcf854793a709210814a1a"
      - name: Lint and types
        run: make lint types
      - name: Tests
        env:
          LRC_REQUIRE_BLUX_SDK: "1"
        run: make test
      - name: Wheel (clean venv; must reproduce the pinned hard-gate fixture)
        run: make wheel
      - name: Examples compile
        run: make examples
      - name: DAT audits LRC
        run: dat audit . --gate --no-target-policy --sarif dat.sarif --quiet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dat-sarif-${{ matrix.python-version }}
          path: dat.sarif
