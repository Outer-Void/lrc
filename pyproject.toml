[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# The PyPI name "lrc" belongs to an unrelated project, so the distribution is outervoid-lrc. The import package
# and the command are still `lrc`.
name = "outervoid-lrc"
version = "2.0.0"
description = "LRC: deterministic repository creation, scaffolding and migration (standalone; BLUX capability adapter)"
readme = "README.md"
authors = [{ name = "Outer Void", email = "theoutervoid@outlook.com" }]
# Licence unchanged from the existing LICENSE file; any change is an owner decision (credits UNR-008).
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# No runtime dependencies. git is used only when a spec asks for an initial commit; DAT only for --audit.
dependencies = []
keywords = ["scaffolding", "templates", "repository", "migration", "reproducible"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "jsonschema>=4.20", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/Outer-Void/lrc"
Repository = "https://github.com/Outer-Void/lrc"
Changelog = "https://github.com/Outer-Void/lrc/blob/main/CHANGELOG.md"

[project.scripts]
lrc = "lrc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lrc*"]

[tool.setuptools.package-data]
lrc = ["py.typed", "schemas/*.json", "templates/*/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "A", "BLE", "RUF", "SIM", "PL", "C4", "N"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLC0415", "S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "BLE", "PLW1510", "N"]
"src/lrc/_stdlib.py" = ["SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["lrc"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
packages = ["lrc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
